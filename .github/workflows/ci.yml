name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Build & Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Step 3: Dependencies install
      - name: Install dependencies
        run: npm ci

      # Step 4: TypeScript check
      - name: TypeScript type check
        run: npx tsc --noEmit

      # Step 5: ESLint check
      - name: Run ESLint
        run: npm run lint

      # Step 6: Build check
      - name: Build project
        run: npm run build